<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>本地模型 — Muse</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; color: #1f1f1f; background: #f7f7f7; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #e3e3e3; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; flex: 0 0 9px; }
  .dot.on { background: #22a06b; }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; white-space: nowrap; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #111; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e3e3e3; }
  .msg.notice { align-self: center; background: #fff8e1; border: 1px solid #f0d48a; color: #7a5b00; font-size: 13px; max-width: 94%; }
  .msg .cursor { display: inline-block; width: 7px; height: 14px; background: #888; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .composer { background: #fff; border-top: 1px solid #e3e3e3; padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; flex: 0 0 auto; }
  .composer textarea { flex: 1; min-height: 38px; max-height: 120px; resize: none; font-size: 14px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
  .composer textarea:focus { border-color: #111; }
  .composer button { font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
  .composer button.ghost { background: #fff; color: #1f1f1f; border-color: #ccc; }
  .composer button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 12px; color: #888; padding: 0 14px 8px; background: #fff; flex: 0 0 auto; }
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span>
  <div class="meta">
    <div class="name" id="modelName">本地模型</div>
    <div class="addr" id="modelAddr">正在读取配置…</div>
  </div>
  <button type="button" id="newBtn">新对话</button>
  <button type="button" id="settingsBtn">设置</button>
</header>
<div id="messages"></div>
<div class="composer">
  <textarea id="input" placeholder="给本地模型发消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
  <button type="button" id="stopBtn" class="ghost" style="display:none">停止</button>
  <button type="button" id="sendBtn">发送</button>
</div>
<div class="hint">本地模型跑在你自己的电脑上，只和你填的地址说话；对话只保存在这个窗口里，关掉就没了。muse.ai 仍然走 Meta 的云端。</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const list = $('messages');
  const input = $('input');
  let active = null; // public provider info from the main process
  let history = []; // { role, content } — in-memory only
  let streaming = false;
  let currentAssistantEl = null;

  function scrollDown() { list.scrollTop = list.scrollHeight; }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
    div.textContent = text;
    list.appendChild(div);
    scrollDown();
    return div;
  }

  function addNotice(text) {
    const div = document.createElement('div');
    div.className = 'msg notice';
    div.textContent = text;
    list.appendChild(div);
    scrollDown();
    return div;
  }

  function setStreaming(on) {
    streaming = on;
    $('sendBtn').disabled = on;
    $('stopBtn').style.display = on ? '' : 'none';
    input.disabled = on;
    if (!on && currentAssistantEl) {
      const cursor = currentAssistantEl.querySelector('.cursor');
      if (cursor) cursor.remove();
      currentAssistantEl = null;
    }
  }

  async function refreshActive() {
    try {
      const res = await window.museLocalModel.getActive();
      active = res && res.active ? res.active : null;
    } catch (e) {
      active = null;
    }
    const dot = $('statusDot');
    if (active) {
      dot.classList.add('on');
      $('modelName').textContent = active.name + (active.model ? ' · ' + active.model : '');
      $('modelAddr').textContent = active.baseUrl + '/v1';
      input.disabled = false;
      $('sendBtn').disabled = false;
    } else {
      dot.classList.remove('on');
      $('modelName').textContent = '本地模型';
      $('modelAddr').textContent = '还没有启用本地模型';
      input.disabled = true;
      $('sendBtn').disabled = true;
      addNotice('还没有启用本地模型：先去“设置 → 本地模型”添加你的 llama.cpp / Ollama / LM Studio 地址和端口，点“测试连接”，再点“启用”。');
    }
  }

  async function send() {
    const text = input.value.trim();
    if (!text || streaming) return;
    if (!active) {
      addNotice('还没有启用本地模型，请先在设置里添加并启用。');
      return;
    }
    input.value = '';
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    currentAssistantEl = addMessage('assistant', '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    currentAssistantEl.appendChild(cursor);
    setStreaming(true);
    try {
      const res = await window.museLocalModel.send(active.id, history);
      if (res && !res.ok) {
        if (currentAssistantEl) currentAssistantEl.textContent = res.error || '发送失败。';
        setStreaming(false);
      }
      // Streaming chunks arrive through onChunk / onDone / onError below.
    } catch (e) {
      if (currentAssistantEl) currentAssistantEl.textContent = '发送失败：' + e.message;
      setStreaming(false);
    }
  }

  window.museLocalModel.onChunk((text) => {
    if (!currentAssistantEl) return;
    const cursor = currentAssistantEl.querySelector('.cursor');
    if (cursor) cursor.remove();
    currentAssistantEl.textContent += text;
    currentAssistantEl.appendChild(cursor);
    scrollDown();
  });
  window.museLocalModel.onDone((info) => {
    if (!currentAssistantEl) { setStreaming(false); return; }
    const text = currentAssistantEl.textContent;
    history.push({ role: 'assistant', content: text });
    if (info && info.aborted) addNotice('已停止。');
    setStreaming(false);
  });
  window.museLocalModel.onError((message) => {
    if (currentAssistantEl) currentAssistantEl.textContent = message || '本地模型出错了。';
    setStreaming(false);
  });

  $('sendBtn').addEventListener('click', send);
  $('stopBtn').addEventListener('click', () => window.museLocalModel.abort());
  $('newBtn').addEventListener('click', () => {
    if (streaming) window.museLocalModel.abort();
    history = [];
    list.innerHTML = '';
    setStreaming(false);
  });
  $('settingsBtn').addEventListener('click', () => window.museLocalModel.openSettings());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  // Keep the input focused and fresh when the window comes back.
  window.addEventListener('focus', refreshActive);

  refreshActive();
})();
</script>
</body>
</html>
