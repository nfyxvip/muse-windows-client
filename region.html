<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>框选区域 — Muse</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: rgba(0,0,0,0.35); cursor: crosshair; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .hint {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff; padding: 8px 16px;
    border-radius: 6px; font-size: 13px; pointer-events: none; white-space: nowrap;
  }
  #sel {
    position: fixed; display: none;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.3);
    background: rgba(255,255,255,0.06);
  }
  #label {
    position: fixed; display: none;
    background: #111; color: #fff; font-size: 13px; padding: 4px 8px;
    border-radius: 4px; pointer-events: none; white-space: nowrap;
  }
  #toolbar {
    position: fixed; display: none;
    background: #111; border-radius: 6px; padding: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #toolbar button {
    background: transparent; color: #fff; border: none;
    font-size: 13px; padding: 6px 14px; cursor: pointer; border-radius: 4px;
    font-family: inherit;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.15); }
  #toolbar button + button { border-left: 1px solid rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div class="hint">拖拽框选要截取的区域，松开确认；双击区域直接复制；按 Esc 取消</div>
<div id="sel"></div>
<div id="label"></div>
<div id="toolbar">
  <button id="copyBtn" type="button">复制</button>
  <button id="saveBtn" type="button">保存</button>
</div>
<script>
(function () {
  const sel = document.getElementById('sel');
  const label = document.getElementById('label');
  const toolbar = document.getElementById('toolbar');
  let start = null;
  let lastRect = null; // last confirmed selection, in screen DIP coordinates
  let captured = false; // true once the toolbar is showing

  function rectFrom(a, b) {
    return {
      x: Math.min(a.x, b.x),
      y: Math.min(a.y, b.y),
      width: Math.abs(b.x - a.x),
      height: Math.abs(b.y - a.y),
    };
  }

  function draw(r) {
    sel.style.display = 'block';
    sel.style.left = r.x + 'px';
    sel.style.top = r.y + 'px';
    sel.style.width = r.width + 'px';
    sel.style.height = r.height + 'px';
    label.style.display = 'block';
    label.textContent = r.width + ' × ' + r.height;
    label.style.left = (r.x + r.width + 8) + 'px';
    label.style.top = (r.y + r.height + 8) + 'px';
  }

  function hideSelection() {
    sel.style.display = 'none';
    label.style.display = 'none';
    toolbar.style.display = 'none';
    lastRect = null;
    captured = false;
  }

  function showToolbar(r) {
    toolbar.style.display = 'flex';
    const tw = toolbar.offsetWidth;
    const th = toolbar.offsetHeight;
    let left = r.x + r.width - tw;
    let top = r.y + r.height + 8;
    if (top + th > window.innerHeight - 8) top = r.y - th - 8;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    toolbar.style.left = left + 'px';
    toolbar.style.top = top + 'px';
  }

  function inside(rect, x, y) {
    return x >= rect.x && x <= rect.x + rect.width && y >= rect.y && y <= rect.y + rect.height;
  }

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('#toolbar')) return; // clicks on the toolbar are its own
    hideSelection();
    start = { x: e.clientX, y: e.clientY };
  });
  document.addEventListener('mousemove', (e) => {
    if (!start) return;
    draw(rectFrom(start, { x: e.clientX, y: e.clientY }));
  });
  document.addEventListener('mouseup', (e) => {
    if (!start) return;
    const r = rectFrom(start, { x: e.clientX, y: e.clientY });
    start = null;
    if (r.width >= 4 && r.height >= 4) {
      lastRect = r;
      window.museRegion.selectRect(r);
    } else {
      hideSelection();
    }
  });
  document.addEventListener('dblclick', (e) => {
    if (captured && lastRect && inside(lastRect, e.clientX, e.clientY)) {
      window.museRegion.copy();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.museRegion.cancel();
    if (e.key === 'Enter' && captured) window.museRegion.copy();
  });

  document.getElementById('copyBtn').addEventListener('click', () => window.museRegion.copy());
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const r = await window.museRegion.save();
    if (r && r.ok === false && r.reason === 'cancelled') {
      // Save dialog cancelled: keep the toolbar open so Copy still works.
    }
  });

  // Shown by the main process once the region has been captured.
  window.museRegion.onCaptured((info) => {
    captured = true;
    if (lastRect) showToolbar(lastRect);
  });
})();
</script>
</body>
</html>
